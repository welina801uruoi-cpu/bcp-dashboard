name: Update BCP Dashboard Data

on:
  schedule:
    # 対策B: 6時間おきに自動巡回・データ更新 (UTC 0, 6, 12, 18時 = JST 9, 15, 21, 3時)
    # 1日4回の実行に抑えることで、月間約120分（無料枠2,000分の6%）となり完全無料で運用可能
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード (full: 全主要都市・16カ国, quick: 高速テスト)'
        type: choice
        options:
          - full
          - quick
        default: full

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # data/*.json をコミット＆プッシュするための権限

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 防災・危機管理データの自動収集 ＆ 非常参集自動通知
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO_USER_ID: ${{ secrets.LINE_TO_USER_ID }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO_ADDRESSES: ${{ secrets.GMAIL_TO_ADDRESSES }}
          WORKFLOW_INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$WORKFLOW_INPUT_MODE" = "quick" ]; then
            echo "=== [クイック更新モードで実行] ==="
            python collect_data.py --quick
          else
            echo "=== [通常巡回モードで実行] ==="
            python collect_data.py
          fi

      - name: 最新データの保存とGitHub Pagesへの反映
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "chore: auto-update disaster data ($TIMESTAMP) [skip ci]"
            git push
            echo "最新データを正常にプッシュしました。"
          else
            echo "データに変更はありませんでした。"
          fi
